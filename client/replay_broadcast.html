/* a team without baked heart art gets a tinted glyph instead (fallback) */
#endcard .ec-heart-glyph {
  color: var(--tc, var(--amber));
  font-size: calc(12 * var(--u));
  line-height: 1;
}
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs prepping their paintball markers
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }

/* Opt-OUT of the #viewpanel overlay (zoom bar + minimap) by param only:
   ?viewpanel=0 sets body[data-noviewpanel]. Defaults are unchanged everywhere
   — the League Replayer shell loads the board with ?embed=1 and KEEPS zoom +
   minimap (that's why #271 blanket-hiding the panel in all embeds was reverted
   in #272). Only surfaces that explicitly ask — billboards (Lobby hero) and
   thumbnail capture — append &viewpanel=0 to drop the panel. Independent of
   embed: the two params don't touch each other. */
body[data-noviewpanel] #viewpanel { display: none !important; }
/* ============================================================
   HIVE additions. Everything above this line is paintbot's broadcast chrome,
   kept verbatim so the scrubber, transport, clock, endcard, banner lane, kill
   feed and relayout loop behave exactly as they do there. Below: the four
   colony hues wired onto the inherited team utility classes, the four new
   readouts (#nestbug, #doctrinebar, #warflash, #cachebar) and the 360px
   legibility rules.
   ============================================================ */

/* Colony hues ride the inherited --red/--blue/--green/--yellow team slots:
   red = Amber, blue = Teal, green = Lime, yellow = Magenta. The chrome's
   TEAM_COLOR JS constants are overridden to match in the page script, so the
   momentum curve and the beat markers use the colony colours too. */
:root {
  --red: #f2c14e;
  --blue: #4ecdc4;
  --green: #9fd356;
  --yellow: #e26db5;
  --amber-hue: #f2c14e;
  --teal-hue: #4ecdc4;
  --lime-hue: #9fd356;
  --magenta-hue: #e26db5;
}

/* Player names must never collapse to "…" in the ~360px featured-match
   iframe: give the name room to grow AND a three-character floor. */
.plate .team-name {
  flex: 1 1 auto;
  min-width: 3.2em;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* --- #nestbug: four delivery counters, one per colony, pulsing on every
   deliver event. This is the idea's "nest counters pulsing" readout. --- */
#nestbug {
  position: absolute;
  left: calc(10 * var(--u, 1px) * var(--hudscale, 1));
  top: calc(var(--topband, 0px) + 8px);
  display: flex;
  gap: calc(10px * var(--hudscale, 1));
  z-index: 6;
  pointer-events: none;
}
#nestbug .nb {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border-radius: 3px;
  background: rgba(22, 17, 13, 0.72);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.10);
  font-family: var(--pixfont);
  font-size: calc(13px * var(--hudscale, 1));
  color: var(--paper);
  line-height: 1;
}
#nestbug .nb .dot {
  width: calc(8px * var(--hudscale, 1));
  height: calc(8px * var(--hudscale, 1));
  border-radius: 50%;
  background: var(--nc, #f2c14e);
  flex: none;
}
#nestbug .nb .lbl { font-family: var(--finefont); font-size: calc(8px * var(--hudscale, 1)); letter-spacing: .12em; opacity: .72; }
#nestbug .nb .num { min-width: 2.2em; text-align: right; transition: transform .08s ease-out; }
#nestbug .nb.bump .num { transform: scale(1.45); }
#nestbug .nb.raided { box-shadow: inset 0 0 0 1px #e0523a; }

/* --- #doctrinebar: each colony's CURRENT scouts / trail / poach, so a
   spectator sees a strategy change BEFORE the ground changes. --- */
#doctrinebar {
  position: absolute;
  right: calc(10px * var(--hudscale, 1));
  top: calc(var(--topband, 0px) + 8px);
  display: flex;
  flex-direction: column;
  gap: 3px;
  z-index: 6;
  pointer-events: none;
}
#doctrinebar .dc {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 7px;
  border-radius: 3px;
  background: rgba(22, 17, 13, 0.66);
  font-family: var(--finefont);
  font-size: calc(9px * var(--hudscale, 1));
  letter-spacing: .08em;
  color: var(--paper);
}
#doctrinebar .dc .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--nc, #f2c14e); }
#doctrinebar .dc .rc { color: #e0523a; font-weight: 700; }

/* --- #warflash: the hatched two-colour overlay a trail_war paints over the
   contested block for 48 frames. --- */
#warflash {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
}
#warflash .wf {
  position: absolute;
  border: 1px solid rgba(242, 232, 216, 0.85);
  background-image: repeating-linear-gradient(45deg,
    var(--wa) 0 6px, var(--wb) 6px 12px);
  opacity: .55;
  animation: wf-pulse .5s ease-out infinite alternate;
}
@keyframes wf-pulse { from { opacity: .25; } to { opacity: .6; } }

/* --- #cachebar: live caches remaining, so the scrub reads "is there food on
   the board right now". --- */
#cachebar {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(var(--topband, 0px) + 8px);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 3px;
  background: rgba(22, 17, 13, 0.72);
  font-family: var(--finefont);
  font-size: calc(9px * var(--hudscale, 1));
  letter-spacing: .12em;
  color: var(--paper);
  z-index: 6;
  pointer-events: none;
}
#cachebar b { font-family: var(--pixfont); font-size: calc(13px * var(--hudscale, 1)); }
#cachebar.bonanza { box-shadow: inset 0 0 0 1px #f2c14e; color: #f2c14e; }

/* --- 360px legibility. The embedded featured-match iframe is ~360px wide, so
   the composition is checked THERE, not at desktop width. --- */
@media (max-width: 640px) {
  #doctrinebar { display: none !important; }
  #viewpanel { display: none !important; }
  #nestbug { gap: 4px; left: 4px; }
  #nestbug .nb { padding: 2px 4px; gap: 3px; }
  #nestbug .nb .lbl { display: none; }
  #cachebar { font-size: 8px; padding: 2px 5px; }
  .speedchips .chip { font-size: 9px; padding: 1px 3px; }
  .plate .lives-label { display: none; }
  .plate .team-name { font-size: calc(13 * var(--u)); }
  #killfeed { max-height: 2.6em; overflow: hidden; }
  #bannerlane .banner-chip { font-size: clamp(11px, 3.4vw, 17px); white-space: nowrap; }
}
#bannerlane .banner-chip { font-size: clamp(11px, 3.4vw, 17px); }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain, kept from paintbot with hive's own plate: the art
       fades out on the first ingested frame. role=status so a screen reader
       hears one "Loading replay". -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Waking the colonies&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Four colonies &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Four plates, two per side, on one row: the inherited 3-4 team
         scorebug path. Real player names live HERE and only here (plus the
         endcard and the feed); the board labels nests Amber…Magenta. -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">&#9656;&#9656;</span>
          <div class="caption" id="clock-caption">In the meadow</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <!-- Nest counters: one per colony, bumped on every deliver event. -->
    <div id="nestbug"></div>
    <!-- Live caches remaining. -->
    <div id="cachebar">CACHES <b>0</b></div>
    <!-- Each colony's current scouts / trail / poach. -->
    <div id="doctrinebar"></div>
    <!-- Trail-war hatch overlay, positioned over the contested block. -->
    <div id="warflash"></div>

    <div id="viewpanel">
      <div id="minimap" title="Click or drag to move the view">
        <canvas id="minimap-canvas"></canvas>
        <span class="mm-cap">View</span>
      </div>
      <div id="zoombar" role="group" aria-label="Board zoom">
        <button class="zbtn" id="zoom-out" title="Zoom out (x)" aria-label="Zoom out">&minus;</button>
        <input id="zoom-slider" type="range" min="0" max="1000" step="1" value="0"
               aria-label="Board zoom" aria-valuetext="Fitted">
        <button class="zbtn" id="zoom-in" title="Zoom in (z)" aria-label="Zoom in">+</button>
        <span id="zoom-read" aria-live="off">FIT</span>
      </div>
    </div>

    <div id="mmwarn">Replay hash mismatch &mdash; showing recorded inputs</div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">&#10226;</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">&#9666;|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">&#9654;</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|&#9656;</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">&#8635;</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">&#9656;&#9656;</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: cache spawns / trail wars / winner ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">&#9656;&#9656; SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">FOOD RETURNED</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">&mdash;</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script src="./broadcast_core.js"></script>
<script>
(function () {
  'use strict';

  // The shared replay chrome (chrome_common.js, spliced over the
  // CHROME_COMMON marker by the native server or the dist bundle). A raw
  // file:// open of this source has no splice, so fail loud and early
  // instead of throwing mid-file.
  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing — this page must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }

  var $ = function (id) { return document.getElementById(id); };
  var TEAMS = ['red', 'blue', 'green', 'yellow'];   // seat 0..3 -> chrome slot
  var WIRE = window.HIVE_WIRE || {};
  var FPS = WIRE.fps || 24;
  var TURN_TICKS = WIRE.turnTicks || 240;

  var replay = null;
  var api = null;
  var board = null;
  var nests = [];
  var state = {
    ph: 'playing', t: 0, st: 0, mx: 1, mt: 1,
    pl: true, lp: false, sk: false, ff: false, sp: 4, en: false,
    teams: {}, pov: -1
  };
  var eventsByTick = {};
  var feedLines = [];
  var lastDelivered = [0, 0, 0, 0];

  var C = window.ChromeCommon({
    send: function (cmd) { command(cmd); },
    sendPov: function () { /* hive has no per-ant POV: colonies are the unit */ },
    getState: function () { return state; }
  });
  // Colony hues over the inherited team slots, so the momentum curve and the
  // scrubber beat markers are drawn in the colonies' own colours.
  C.TEAM_COLOR.red = '#f2c14e';
  C.TEAM_COLOR.blue = '#4ecdc4';
  C.TEAM_COLOR.green = '#9fd356';
  C.TEAM_COLOR.yellow = '#e26db5';

  function esc(t) { return C.esc(t); }

  // ---- transport commands (the chrome speaks paintbot's command chars) ----
  function command(cmd) {
    switch (cmd) {
      case '1': state.sp = 1; break;
      case '2': state.sp = 2; break;
      case '3': state.sp = 3; break;
      case '4': state.sp = 4; break;
      case '8': state.sp = 8; break;
      case '6': state.sp = 16; break;
      default: break;
    }
    renderChrome();
  }

  // ---- scorebug ------------------------------------------------------------
  function buildScorebug() {
    var sides = [$('plates-l'), $('plates-r')];
    sides[0].innerHTML = '';
    sides[1].innerHTML = '';
    sides[0].classList.add('row');
    sides[1].classList.add('row');
    for (var seat = 0; seat < 4; seat++) {
      var team = TEAMS[seat];
      var plate = document.createElement('div');
      plate.className = 'plate ' + team + ' ' + (seat % 2 === 0 ? 'side-l' : 'side-r');
      plate.setAttribute('data-team', team);
      plate.id = 'plate-' + seat;
      plate.innerHTML =
        '<div class="flagicon" id="chip-' + seat + '" style="background:' +
          C.TEAM_COLOR[team] + '"></div>' +
        '<div class="team-id">' +
        '<div class="lives-line">' +
        '<span class="team-name" id="name-' + seat + '"></span>' +
        '<span class="lives-label">Food</span>' +
        '<span class="lives-num" id="food-' + seat + '">0</span>' +
        '</div>' +
        '<div class="squad" id="alias-' + seat + '"></div>' +
        '</div>';
      sides[seat % 2].appendChild(plate);
    }
    for (seat = 0; seat < 4; seat++) {
      // textContent only: names are player-controlled data.
      $('name-' + seat).textContent = replay.names.players[seat];
      $('alias-' + seat).textContent = replay.names.aliases[seat];
    }
  }

  function buildNestbug() {
    var host = $('nestbug');
    host.innerHTML = '';
    for (var seat = 0; seat < 4; seat++) {
      var el = document.createElement('div');
      el.className = 'nb';
      el.id = 'nb-' + seat;
      el.style.setProperty('--nc', replay.names.colours[seat]);
      el.innerHTML = '<span class="dot"></span><span class="lbl"></span>' +
        '<span class="num" id="nbnum-' + seat + '">0</span>';
      host.appendChild(el);
      el.querySelector('.lbl').textContent = replay.names.aliases[seat];
    }
    var bar = $('doctrinebar');
    bar.innerHTML = '';
    for (seat = 0; seat < 4; seat++) {
      var dc = document.createElement('div');
      dc.className = 'dc';
      dc.id = 'dc-' + seat;
      dc.style.setProperty('--nc', replay.names.colours[seat]);
      dc.innerHTML = '<span class="dot"></span><span id="dctext-' + seat + '"></span>';
      bar.appendChild(dc);
    }
  }

  // ---- event indexing ------------------------------------------------------
  function indexEvents() {
    eventsByTick = {};
    (replay.events || []).forEach(function (e) {
      var t = e.t | 0;
      (eventsByTick[t] = eventsByTick[t] || []).push(e);
    });
    // Scrubber beats: cache spawns, trail wars and raids are the ticks a
    // highlight-reel scrub jumps between.
    (replay.events || []).forEach(function (e) {
      if (e.type === 'source_spawn') C.markBeat(e.t, 'flag', '');
      else if (e.type === 'trail_war') C.markBeat(e.t, 'kill', 'red');
      else if (e.type === 'raid') C.markBeat(e.t, 'kill', 'yellow');
    });
    // Lull spans: 240-tick stretches with no deliver, no source_spawn and no
    // trail_war run at 16x under the inherited skip machinery.
    var busy = {};
    (replay.events || []).forEach(function (e) {
      if (e.type === 'deliver' || e.type === 'source_spawn' ||
          e.type === 'trail_war') {
        busy[Math.floor(e.t / 240)] = true;
      }
    });
    var spans = [];
    var total = Math.ceil(replay.tick_count / 240);
    for (var i = 0; i < total; i++) {
      if (busy[i]) continue;
      var a = i * 240, b = Math.min(replay.tick_count, (i + 1) * 240);
      if (spans.length && spans[spans.length - 1][1] === a) {
        spans[spans.length - 1][1] = b;
      } else {
        spans.push([a, b]);
      }
    }
    state.lulls = spans;
    C.ingestLullSpans(state);

    // Momentum: all four delivered curves across the match, straight off the
    // keyframes.
    var pts = (replay.keyframes || []).map(function (k) {
      return [k.t].concat(k.del);
    });
    state.lead = { teams: TEAMS, pts: pts };
    C.ingestLeadSeries(state);

    var results = replay.results || {};
    if (results.winner === null || results.winner === undefined) {
      C.setVerdict({ draw: true, t: replay.tick_count });
    } else {
      C.setVerdict({ winner: TEAMS[results.winner], t: replay.tick_count });
    }
  }

  // ---- feed and banners ----------------------------------------------------
  function feed(text, colour) {
    feedLines.push({ text: text, colour: colour });
    while (feedLines.length > 6) feedLines.shift();
    var host = $('killfeed');
    host.innerHTML = '';
    feedLines.forEach(function (line) {
      var el = document.createElement('div');
      el.className = 'feed-row';
      el.style.setProperty('--tc', line.colour || '');
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = line.text;
      el.appendChild(who);
      host.appendChild(el);
    });
  }

  function banner(text, colour) {
    var host = $('bannerlane');
    var el = document.createElement('div');
    el.className = 'banner-chip accent';
    el.style.setProperty('--tc', colour || '');
    el.textContent = text;
    host.appendChild(el);
    window.setTimeout(function () {
      el.classList.add('leaving');
      window.setTimeout(function () { el.remove(); }, 300);
    }, 2600);
  }

  function seatOfAlias(alias) {
    for (var seat = 0; seat < 4; seat++) {
      if (replay.names.aliases[seat] === alias) return seat;
    }
    return -1;
  }

  function bumpNest(seat, raided) {
    var el = $('nb-' + seat);
    if (!el) return;
    el.classList.add('bump');
    if (raided) el.classList.add('raided');
    window.setTimeout(function () {
      el.classList.remove('bump');
      if (raided) el.classList.remove('raided');
    }, raided ? 500 : 250);
  }

  function warFlash(bx, by, ca, cb) {
    var host = $('warflash');
    var el = document.createElement('div');
    el.className = 'wf';
    el.style.left = (bx / 20 * 100) + '%';
    el.style.top = (by / 11 * 100) + '%';
    el.style.width = (100 / 20) + '%';
    el.style.height = (100 / 11) + '%';
    el.style.setProperty('--wa', ca);
    el.style.setProperty('--wb', cb);
    host.appendChild(el);
    window.setTimeout(function () { el.remove(); }, 2000);
  }

  function applyEvents(tick) {
    var list = eventsByTick[tick];
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      switch (e.type) {
        case 'doctrine': {
          var seat = e.seat | 0;
          var el = $('dctext-' + seat);
          if (el) {
            el.textContent = e.recall
              ? 'RECALL'
              : ('sc ' + e.scouts + ' · tr ' + e.trail_gain + ' · po ' + e.poach);
          }
          var line = replay.names.aliases[seat] + ' → ' + e.scouts +
            '% scouts, trail ' + e.trail_gain + ', poach ' + e.poach +
            (e.focus ? (', focus block ' + e.focus[0] + ',' + e.focus[1]) : '');
          if (e.recall) line = replay.names.aliases[seat] + ' → RECALL';
          feed(line, replay.names.colours[seat]);
          if (e.say) {
            feed(replay.names.aliases[seat] + ' says "' + e.say + '"',
              replay.names.colours[seat]);
          }
          break;
        }
        case 'fallback':
          feed(replay.names.aliases[e.seat | 0] + ' falls back (' + e.cause + ')',
            '#e0523a');
          break;
        case 'deliver':
          bumpNest(e.c | 0, e.r === 1);
          if (board && nests[replay.seat_nests[e.c | 0]]) {
            var n = nests[replay.seat_nests[e.c | 0]];
            board.ring(n[0], n[1], replay.names.colours[e.c | 0], 6, 10);
          }
          break;
        case 'source_spawn': {
          var bonanza = e.kind === 'bonanza';
          (e.sources || []).forEach(function (s) {
            if (board) {
              board.ring(s.cell[0], s.cell[1],
                bonanza ? '#f2c14e' : '#e8d07a', 12, bonanza ? 34 : 16);
            }
          });
          if (bonanza) banner('BONANZA — CENTRE', '#f2c14e');
          break;
        }
        case 'source_gone':
          if (board) {
            board.ring(e.cell[0], e.cell[1],
              e.cause === 'expired' ? '#8b8578' : '#fdf6e3', 10, 12);
          }
          break;
        case 'raid': {
          var raider = seatOfAlias(e.colony);
          var victim = seatOfAlias(e.victim);
          banner('RAID — ' + e.colony + ' lifts from ' + e.victim + "'s doorstep",
            raider >= 0 ? replay.names.colours[raider] : '');
          feed('RAID  ' + e.colony + ' → ' + e.victim + '  (' + e.units + ')',
            raider >= 0 ? replay.names.colours[raider] : '');
          if (victim >= 0) bumpNest(victim, true);
          break;
        }
        case 'trail_war': {
          var sa = seatOfAlias(e.colonies[0]);
          var sb = seatOfAlias(e.colonies[1] || e.colonies[0]);
          warFlash(e.block[0], e.block[1],
            sa >= 0 ? replay.names.colours[sa] : '#fff',
            sb >= 0 ? replay.names.colours[sb] : '#fff');
          banner('TRAIL WAR — ' + e.colonies.join(' vs ') + ' over block ' +
            e.block[0] + ',' + e.block[1], '#fdf6e3');
          break;
        }
        default: break;
      }
    }
  }

  // ---- chrome render -------------------------------------------------------
  function renderChrome() {
    for (var seat = 0; seat < 4; seat++) {
      state.teams[TEAMS[seat]] = { lives: lastDelivered[seat] };
      var num = $('food-' + seat);
      if (num) num.textContent = String(lastDelivered[seat]);
      var nb = $('nbnum-' + seat);
      if (nb) nb.textContent = String(lastDelivered[seat]);
    }
    var leader = 0;
    for (seat = 1; seat < 4; seat++) {
      if (lastDelivered[seat] > lastDelivered[leader]) leader = seat;
    }
    for (seat = 0; seat < 4; seat++) {
      var plate = $('plate-' + seat);
      if (plate) plate.classList.toggle('leader', seat === leader);
    }
    C.renderClock(state);
    C.renderTransport(state);
    var caption = $('clock-caption');
    if (state.ph === 'playing') {
      caption.textContent = state.ff
        ? 'FORAGING — 16×'
        : ('turn ' + Math.floor(state.t / TURN_TICKS) + '/' +
           Math.ceil(replay.tick_count / TURN_TICKS));
    }
  }

  function renderEndcard() {
    var r = replay.results || {};
    var total = r.total_delivered || 0;
    var winner = r.winner;
    $('ec-headline').textContent = winner === null || winner === undefined
      ? 'Tied — ' + total + ' returned'
      : replay.names.aliases[winner] + ' wins — ' + r.delivered[winner] +
        ' of ' + total + ' (' +
        (total ? (100 * r.delivered[winner] / total).toFixed(1) : '0.0') + '%)';
    $('ec-wincond').textContent = 'Most food carried home. Score is your share of all food returned.';
    $('ec-how').textContent = r.reason + ' / ' + r.end_rule + ' · ' +
      r.final_tick + ' ticks · seed ' + r.seed;
    var host = $('ec-teams');
    host.innerHTML = '';
    for (var seat = 0; seat < 4; seat++) {
      var el = document.createElement('div');
      el.className = 'ec-team' + (seat === winner ? ' win' : '');
      el.style.setProperty('--tc', replay.names.colours[seat]);
      var name = document.createElement('div');
      name.className = 'ec-tname';
      name.textContent = replay.names.players[seat] + ' · ' +
        replay.names.aliases[seat];
      var line = document.createElement('div');
      line.className = 'ec-pol';
      line.textContent = r.delivered[seat] + ' returned · ' +
        (r.scores[seat] * 100).toFixed(1) + '% · raids ' + r.raided_units[seat];
      el.appendChild(name);
      el.appendChild(line);
      host.appendChild(el);
    }
    $('endcard').classList.add('on');
  }

  // ---- playback ------------------------------------------------------------
  var accumulator = 0;
  var lastFrame = 0;
  var pendingSeek = -1;

  function inLull(tick) {
    if (!state.lulls) return false;
    for (var i = 0; i < state.lulls.length; i++) {
      if (tick >= state.lulls[i][0] && tick < state.lulls[i][1]) return true;
    }
    return false;
  }

  function pump(ticks) {
    if (ticks <= 0) return;
    api.input(JSON.stringify({ advance: ticks }));
    if (!api.frame()) {
      showFailure(new Error(api.error() || 'replay runtime failed'));
      return;
    }
    var packet = api.packet();
    var frame = board.ingest(packet, nests);
    if (frame) {
      state.t = frame.tick;
      lastDelivered = frame.delivered.slice();
      var cache = $('cachebar');
      cache.innerHTML = 'CACHES <b>' + frame.sources.length + '</b>';
      cache.classList.toggle('bonanza', frame.sources.some(function (s) {
        return s.spawnAmount >= 100;
      }));
    }
    var mismatch = api.mismatchTick();
    if (mismatch >= 0) {
      $('mmwarn').classList.add('on');
      document.documentElement.setAttribute('data-replay-mismatch-tick',
        String(mismatch));
    }
  }

  function seek(tick) {
    tick = Math.max(0, Math.min(replay.tick_count, Math.round(tick)));
    api.input(JSON.stringify({ seek: tick }));
    api.frame();
    var frame = board.ingest(api.packet(), nests);
    if (frame) {
      state.t = frame.tick;
      lastDelivered = frame.delivered.slice();
    }
    feedLines = [];
    $('killfeed').innerHTML = '';
    state.ph = state.t >= replay.tick_count ? 'gameover' : 'playing';
    renderChrome();
  }

  function tickLoop(now) {
    window.requestAnimationFrame(tickLoop);
    if (!api || !board) return;
    var dt = lastFrame ? Math.min(250, now - lastFrame) : 0;
    lastFrame = now;
    if (state.ph === 'gameover' && !state.lp) { board.draw(nests); return; }
    if (!state.pl) { board.draw(nests); return; }

    var speed = state.sp;
    state.ff = state.sk && inLull(state.t);
    if (state.ff) speed = 16;
    accumulator += dt * (FPS * speed) / 1000;
    var steps = Math.floor(accumulator);
    accumulator -= steps;
    if (steps > 0) {
      steps = Math.min(steps, 400);
      var from = state.t;
      pump(steps);
      for (var t = from; t <= state.t; t++) applyEvents(t);
      if (state.t >= replay.tick_count) {
        if (state.lp) { seek(0); state.pl = true; }
        else {
          state.ph = 'gameover';
          renderEndcard();
        }
      }
      renderChrome();
    } else {
      board.draw(nests);
    }
  }

  // ---- failures ------------------------------------------------------------
  var failed = false;
  function showFailure(error) {
    if (failed) return;
    failed = true;
    console.error(error);
    var status = $('status');
    if (status) {
      status.textContent = 'Replay failed: ' + (error.message || String(error));
      status.classList.add('show');
    }
  }
  window.HiveShowFailure = showFailure;

  // ---- relayout (paintbot's fixed-point loop, verbatim in shape) ----------
  var viewport = $('viewport');
  var stage = $('stage');
  var BOARD_ASPECT = 1280 / 704;
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    var scorebug = $('scorebug');
    var transport = $('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stage.style.width = boardW + 'px';
      stage.style.height = (boardH + topBand + band) + 'px';
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
  }
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(viewport);
  window.addEventListener('resize', relayout);

  // ---- transport wiring ----------------------------------------------------
  function bind(id, fn) { var el = $(id); if (el) el.addEventListener('click', fn); }
  bind('btn-play', function () { state.pl = !state.pl; renderChrome(); });
  bind('btn-restart', function () {
    seek(0); state.pl = true; state.ph = 'playing';
    $('endcard').classList.remove('on');
  });
  bind('btn-back', function () { seek(state.t - 1); state.pl = false; });
  bind('btn-fwd', function () { seek(state.t + 5 * FPS); });
  bind('btn-end', function () { seek(replay.tick_count); });
  bind('btn-loop', function () { state.lp = !state.lp; renderChrome(); });
  bind('btn-skip', function () { state.sk = !state.sk; renderChrome(); });
  $('scrub').addEventListener('click', function (event) {
    var box = this.getBoundingClientRect();
    seek(((event.clientX - box.left) / box.width) * replay.tick_count);
  });
  window.addEventListener('keydown', function (event) {
    if (event.key === ' ') { state.pl = !state.pl; event.preventDefault(); }
    else if (event.key === 'b') seek(state.t - 1);
    else if (event.key === '.') seek(state.t + 5 * FPS);
    else if (event.key === 'e') seek(replay.tick_count);
    else if (event.key === 'r') state.lp = !state.lp;
    else if (event.key === 'f') state.sk = !state.sk;
    else if (event.key === ',') { seek(0); state.pl = true; }
    renderChrome();
  });

  // ---- attach (called by static_replay.js once the wasm module is up) -----
  window.HiveChrome = {
    attach: function (config) {
      replay = config.replay;
      api = config.api;
      nests = (replay.field.nests || []).map(function (n) { return n.cell; });
      state.mx = replay.tick_count;
      state.mt = replay.tick_count;
      state.en = true;
      board = new window.HiveBoard($('board'), config.assetBase || './art');
      buildScorebug();
      buildNestbug();
      indexEvents();
      return board.loadArt().then(function () {
        board.setField(replay.field.cols, replay.field.rows, config.rock,
          replay.names.colours);
        $('lockerroom').classList.add('gone');
        $('status').textContent = '';
        document.documentElement.setAttribute('data-replay-loaded', '1');
        relayout();
        seek(0);
        state.pl = true;
        window.requestAnimationFrame(tickLoop);
      });
    },
    fail: showFailure
  };

  relayout();
})();
</script>
</body>
</html>
